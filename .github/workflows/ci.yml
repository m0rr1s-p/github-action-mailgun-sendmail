name: ci.yml
on:
  workflow_dispatch:
    inputs:
      secrets:
        description: 'Use secrets'
        required: true
        type: boolean
        default: false
      usermapp:
        description: 'Use usermapp service'
        required: true
        type: boolean
        default: false

jobs:
  buildandtest:
    if: ${{ github.event.inputs.secrets }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Send mail
        uses: ./
        id: mail
        with:
          api_key: ${{ secrets.MAILGUN_API_KEY }}
          domain: ${{ secrets.MAILGUN_DOMAIN }}
          from: ${{ secrets.MAILGUN_FROM }}
          to: ${{ secrets.MAILGUN_TO }}
          subject: ${{ github.event.head_commit.message }}
          message: '<p>Hello World</p>'
      - name: Print outputs
        run: echo ${{ steps.mail.outputs.result }}
  usermapp:
    if: ${{ github.event.inputs.usermapp }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Get E-Mail address of actor
        id: get_email
        run: |
          EMAIL=$(curl -X GET 'https://usermapp.sanctum.mineral-minds.net/email?github_username=${{ github.actor }}' -H 'api-key: ${{ secrets.USERMAPP_API_KEY }}')
          echo "::add-mask::$EMAIL"
          echo "USERMAPP_EMAIL=$EMAIL" >> $GITHUB_ENV
      - run: echo ${{ env.USERMAPP_EMAIL }}
      - name: Send mail
        uses: ./
        id: mail
        with:
          api_key: ${{ secrets.MAILGUN_API_KEY }}
          domain: ${{ secrets.MAILGUN_DOMAIN }}
          from: ${{ secrets.MAILGUN_FROM }}
          to: "${{ env.USERMAPP_EMAIL }}"
          subject: "Workflow Dispatch mailgun sendmail"
          message: '<p>Hello World</p>'
      - name: Print outputs
        run: echo ${{ steps.mail.outputs.result }}
